name = "neon-storage-cdn-demo"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
NEON_STORAGE_ORIGIN = "https://<branch-id>.storage.c-<N>.us-east-2.aws.neon.tech"
BUCKET = "cdn-demo"
REGION = "us-east-2"

[triggers]
crons = ["0 * * * *"]

[[ratelimits]]
name = "UPLOAD_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
